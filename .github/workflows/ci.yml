name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Configure git identity for test fixtures
      - name: Lint format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Test
        run: python -m pytest -q
        # ORCHESTRATOR_LIVE_TEST is intentionally unset: the live v0.1.0
        # closed-loop test costs real API usage and needs codex/claude
        # authenticated, neither of which belongs in a public CI run.

      - name: Build package
        run: pip install build && python -m build
